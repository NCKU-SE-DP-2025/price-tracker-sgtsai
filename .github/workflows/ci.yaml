name: CI Pipeline

on:
  push:
    branches:
      - 'main'
      - 'develop'
      - 'fix-intergration-test'
      - 'refactor-crawler-oop-implementation'
  pull_request:
    branches:
      - 'main'
      - 'develop'

jobs:
  test:
    runs-on: [F74146856]

    steps:
      # -------------------------
      # PRE-CLEAN (Fix for EPERM)
      # -------------------------
      - name: Pre-clean workspace (stop stale Python processes)
        if: always()
        run: |
          taskkill /IM python.exe /F 2>$null
          taskkill /IM python3.exe /F 2>$null
          taskkill /IM pytest.exe /F 2>$null

      # -------------------------
      # Checkout Code
      # -------------------------
      - name: Checkout code
        uses: actions/checkout@v3

      # -------------------------
      # Setup Python
      # -------------------------
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-mock pytest-cov

      # - name: Run unit tests
      #   env:
      #     OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      #   run: |
      #     cd backend
      #     pytest tests/unit --cov=src --cov-report=xml --disable-warnings

      - name: Run integration tests (with mock DB)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd backend
          pytest tests/integration --cov=src --cov-report=xml --disable-warnings --cache-clear

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      # -------------------------
      # POST-CLEAN (Fix EPERM locks)
      # -------------------------
      - name: Kill Python/pytest processes to avoid EPERM cleanup errors
        if: always()
        run: |
          taskkill /IM python.exe /F 2>$null; if ($LASTEXITCODE -ne 0) { Write-Host "python already stopped" }
          taskkill /IM python3.exe /F 2>$null; if ($LASTEXITCODE -ne 0) { Write-Host "python3 already stopped" }
          taskkill /IM pytest.exe /F 2>$null; if ($LASTEXITCODE -ne 0) { Write-Host "pytest already stopped" }
