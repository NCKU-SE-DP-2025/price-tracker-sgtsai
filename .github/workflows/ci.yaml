name: CI Pipeline

on:
  push:
    branches:
      - 'main'
      - 'develop'
      - 'fix-intergration-test'
      - 'refactor-crawler-oop-implementation'
  pull_request:
    branches:
      - 'main'
      - 'develop'

jobs:
  test:
    runs-on: [F74146856]

    steps:
      # -------------------------
      # PRE-CLEAN (stop any stale Python/pytest processes)
      # -------------------------
      - name: Pre-clean workspace
        shell: powershell
        run: |
          # Kill python.exe if running
          $p = Get-Process python -ErrorAction SilentlyContinue
          if ($p) { Stop-Process -Id $p.Id -Force }

          # Kill python3.exe if running
          $p3 = Get-Process python3 -ErrorAction SilentlyContinue
          if ($p3) { Stop-Process -Id $p3.Id -Force }

          # Kill pytest.exe if running
          $pp = Get-Process pytest -ErrorAction SilentlyContinue
          if ($pp) { Stop-Process -Id $pp.Id -Force }

      # -------------------------
      # Checkout Code
      # -------------------------
      - name: Checkout code
        uses: actions/checkout@v3

      # -------------------------
      # Setup Python
      # -------------------------
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-mock pytest-cov

      # - name: Run unit tests
      #   env:
      #     OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      #   run: |
      #     cd backend
      #     pytest tests/unit --cov=src --cov-report=xml --disable-warnings

      - name: Run integration tests (with mock DB)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd backend
          pytest tests/integration --cov=src --cov-report=xml --disable-warnings --cache-clear

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      # -------------------------
      # POST-CLEAN (stop any lingering Python/pytest processes)
      # -------------------------
      - name: Post-clean workspace
        if: always()
        shell: powershell
        run: |
          # Kill python.exe if running
          $p = Get-Process python -ErrorAction SilentlyContinue
          if ($p) { Stop-Process -Id $p.Id -Force }

          # Kill python3.exe if running
          $p3 = Get-Process python3 -ErrorAction SilentlyContinue
          if ($p3) { Stop-Process -Id $p3.Id -Force }

          # Kill pytest.exe if running
          $pp = Get-Process pytest -ErrorAction SilentlyContinue
          if ($pp) { Stop-Process -Id $pp.Id -Force }
