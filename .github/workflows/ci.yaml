name: CI Pipeline

on:
  push:
    branches:
      - 'main'
      - 'develop'
      - 'fix-intergration-test'  # corrected spelling
  pull_request:
    branches:
      - 'main'
      - 'develop'
  workflow_dispatch:  # allows manual triggering from GitHub

jobs:
  test:
    runs-on: [self-hosted, F74146856]

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Verify Python (use system Python)
      - name: Check Python
        run: |
          python --version
          pip --version

      # 3. Clean workspace (optional, avoids conflicts)
      - name: Clean workspace
        run: git clean -xfd

      # 4. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-mock pytest-cov

      # 5. Run integration tests
      - name: Run integration tests (with mock DB)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd backend
          pytest tests/integration --cov=src --cov-report=xml --disable-warnings

      # 6. Upload coverage report
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
